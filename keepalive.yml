# Keeps the free Supabase project from pausing after ~7 days without activity.
# Setup: put this folder in a GitHub repo, then Settings > Secrets and variables > Actions > add
#   SUPABASE_URL      = https://YOUR-PROJECT.supabase.co
#   SUPABASE_ANON_KEY = your publishable (anon) key
name: Keep Supabase awake
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/shares?select=token&limit=1" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
